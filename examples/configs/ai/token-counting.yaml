# Token counting: extract and surface AI provider token usage.
#
# Chains token_count → x_token_headers → access_log.
#
# token_count reads the provider response body (or headers for
# bedrock_invoke_model) and writes input/output/total counts to
# FilterContext metadata.
#
# x_token_headers injects X-Token-Input, X-Token-Output, and
# X-Token-Total into the downstream response — but only when counts
# are available during the response-header phase.  This is currently
# limited to the bedrock_invoke_model provider, which delivers counts
# via upstream response headers.  For all other providers (openai,
# anthropic, google, bedrock, azure) token counts are parsed from the
# response body, which arrives after headers have already been sent
# downstream; in those cases the counts are stored in FilterContext
# and emitted via access_log, but the X-Token-* headers are not
# injected.
#
# access_log emits a structured log line per request.
#
# Usage:
#   RUST_LOG=info cargo run -p praxis -- -c examples/configs/ai/token-counting.yaml

listeners:
  - name: gateway
    address: "127.0.0.1:8080"
    filter_chains:
      - token-counting

filter_chains:
  - name: token-counting
    filters:
      # x_token_headers must come before token_count so that in the
      # reverse response-header phase it runs after token_count and can
      # read the token metadata that token_count sets from response headers
      # (bedrock_invoke_model) or from on_response_body (all others).
      - filter: x_token_headers

      - filter: token_count
        provider: openai

      - filter: access_log

      - filter: router
        routes:
          - path_prefix: "/"
            cluster: ai-provider

      - filter: load_balancer
        clusters:
          - name: ai-provider
            endpoints:
              - "127.0.0.1:8000"
